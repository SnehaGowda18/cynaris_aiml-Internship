name: W12D2 ML API CI/CD

on:
  push:
    branches:
      - "feat/aiml-W12-sneha"
  pull_request:
    branches:
      - "feat/aiml-W12-sneha"

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Build Docker image
        run: docker build -t w12d2-ml-api .

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker tag w12d2-ml-api ${{ secrets.DOCKERHUB_USERNAME }}/w12d2-ml-api:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/w12d2-ml-api:latest